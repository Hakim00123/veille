name: Transcription podcasts

# Transcrit les nouveaux episodes de tous les podcasts de podcasts.json.
# Un job par podcast, en parallele : un flux mort n'empeche pas les autres.
# Les fiches sont remontees en artefacts puis commitees une seule fois,
# ce qui evite les collisions de push entre jobs simultanes.

on:
  schedule:
    - cron: "0 17 * * 0"     # dimanche 17 h UTC, pret pour le lundi matin
  workflow_dispatch:
    inputs:
      podcast:
        description: "Un seul slug (ex. a16z). Vide = tous."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: transcript-podcasts
  cancel-in-progress: false

jobs:
  liste:
    runs-on: ubuntu-latest
    outputs:
      matrice: ${{ steps.gen.outputs.matrice }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - id: gen
        run: |
          if [ -n "${{ inputs.podcast }}" ]; then
            echo 'matrice={"include":[{"slug":"${{ inputs.podcast }}","nom":"${{ inputs.podcast }}"}]}' >> "$GITHUB_OUTPUT"
          else
            python scripts/transcript_podcast.py --matrice
          fi

  transcrire:
    needs: liste
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false          # un podcast en echec n'annule pas les autres
      max-parallel: 5
      matrix: ${{ fromJson(needs.liste.outputs.matrice) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Dependances
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --quiet faster-whisper requests

      - name: Transcription
        run: python scripts/transcript_podcast.py --slug "${{ matrix.slug }}"

      - name: Remontee des fiches
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: podcast-${{ matrix.slug }}
          path: data/podcasts/${{ matrix.slug }}
          if-no-files-found: ignore
          retention-days: 3

  publier:
    needs: transcrire
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Recuperation des fiches
        uses: actions/download-artifact@v4
        with:
          path: /tmp/fiches
          pattern: podcast-*

      - name: Mise en place
        run: |
          mkdir -p data/podcasts
          shopt -s nullglob
          for d in /tmp/fiches/podcast-*; do
            slug="${d##*/podcast-}"
            mkdir -p "data/podcasts/$slug"
            cp -R "$d/." "data/podcasts/$slug/"
          done
          echo "--- contenu ---"
          find data/podcasts -name '*.json' | sort

      - name: Commit
        run: |
          git config user.name "veille-bot"
          git config user.email "actions@github.com"
          git add data/podcasts
          if git diff --staged --quiet; then
            echo "Aucun nouvel episode."
            exit 0
          fi
          git commit -m "Podcasts : transcriptions $(date -u +'%Y-%m-%d')"
          for tentative in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "Push reussi (tentative $tentative)."
              exit 0
            fi
            echo "Push rejete, nouvelle tentative dans 5 s..."
            sleep 5
          done
          echo "Push impossible apres 3 tentatives." >&2
          exit 1
