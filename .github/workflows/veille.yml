name: Collecte veille

on:
  schedule:
    - cron: "0 */6 * * *"   # toutes les 6 heures (UTC)
  workflow_dispatch:         # bouton "Run workflow" dans l'onglet Actions

permissions:
  contents: write

# evite deux collectes simultanees qui se marcheraient dessus
concurrency:
  group: collecte-veille
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0     # historique complet, necessaire au rebase

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Dependances
        run: pip install --quiet feedparser requests

      - name: Collecte des flux
        run: python scripts/collect.py

      - name: Commit du resultat
        run: |
          git config user.name "veille-bot"
          git config user.email "actions@github.com"
          git add data
          if git diff --staged --quiet; then
            echo "Aucun changement, rien a commiter."
            exit 0
          fi
          git commit -m "Veille : $(date -u +'%Y-%m-%d %H:%M UTC')"
          # le depot a pu bouger pendant la collecte : on se resynchronise
          for tentative in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "Push reussi (tentative $tentative)."
              exit 0
            fi
            echo "Push rejete, nouvelle tentative dans 5 s..."
            sleep 5
          done
          echo "Push impossible apres 3 tentatives." >&2
          exit 1
